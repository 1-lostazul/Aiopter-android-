name: Build and test

on:
  pull_request:
  push:
    branches: [main, real-world-readiness]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build Android
        run: |
          ./gradlew \
            :core:policy:test \
            :android:app:testDebugUnitTest \
            :android:app:lintDebug \
            :android:app:assembleDebug \
            :android:app:assembleRelease \
            --stacktrace
      - name: Require debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aiopter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
